schema_version = 1

[policy]
system_library = "zsys"
forbidden_packages = ["ztty-ui", "ztui-core", "zui", "zui-native"]

[repositories.zrun]
role = "library"
manifests = ["Cargo.toml"]
# zrun --zmem optionally launches the standalone zmem CLI.
requires = ["zmem"]

[repositories.zaccel]
role = "application"
manifests = ["Cargo.toml"]

[repositories.zbridge]
role = "library"
manifests = ["Cargo.toml"]

[repositories.ssmcp]
role = "application"
manifests = ["Cargo.toml", "apps/ssmcp-desktop/Cargo.toml"]
# Manages the standalone Zuse CLI at runtime; it is not a linked Cargo dependency.
requires = ["zuse"]

[repositories.ztty]
role = "application"
manifests = ["Cargo.toml", "examples/dedent-plugin/Cargo.toml", "tests/fixtures/text-plugin/Cargo.toml"]

[repositories.zcalld]
role = "application"
# Optional frontend and helper sources are part of release/source distribution.
requires = ["zcall-gui", "zcall-omarchy", "zcalld-compat"]
# This excluded app must match the source distributed by the aggregate.
source_links = { "apps/zcall-gui" = "zcall-gui" }

[repositories.zuse]
role = "application"

[repositories.zcall]
manifests = ["Cargo.toml", "fuzz/Cargo.toml"]

[repositories.zconv]
manifests = ["Cargo.toml", "fuzz/Cargo.toml"]

[repositories.zdwire]
manifests = ["Cargo.toml", "fuzz/Cargo.toml"]

[repositories.zdot]
role = "application"

[repositories.zclick]
role = "bindings"

[repositories.zcalld-compat]
role = "extension"
requires = ["zcalld"]

[repositories.zshard]
role = "shell"

[repositories.oh-my-ztty]
role = "suite"
# Linux launchers select the separately installed native zrun shell by default.
requires = ["ztty", "zrun", "ssmcp", "zshard", "zdot", "zrc", "zfetch", "zmem", "zuse"]

[repositories.zcall-gui]
role = "application"
requires = ["zcalld", "zgpui"]

[repositories.lmm-api-source]
role = "application"
requires = ["lmm"]
manifests = ["services/core/Cargo.toml"]
source_links = { "apps/cli" = "lmm" }

[repositories.lmm]
role = "application"

[repositories.ztype]
role = "application"
requires = ["zgpui"]

[repositories.zrc]
role = "configuration"
manifests = ["Cargo.toml"]
requires = ["zdot", "ssmcp"]

[repositories.zfetch]
role = "application"

[repositories.zdistro]
role = "application"

[repositories.zmcl]
role = "application"
requires = ["zconv", "zclap", "zgpui", "zi18n"]

[repositories.OniMods]
role = "application"
# Keep active standalone simulation workspaces in locked source verification.
manifests = [
  "Cargo.toml",
  "mods/CycleTrim/OniSim/gpu/Cargo.toml",
  "mods/CycleTrim/OniSim/native/Cargo.toml",
  "mods/CycleTrim/OniSim/lean-lab/harness/Cargo.toml",
]

[repositories.zcall-omarchy]
role = "application"
manifests = []
# The optional compatibility features share this frontend and need propagation.
requires = ["zcalld", "zcalld-compat"]

[repositories.mechrevo-drivers]
role = "application"
manifests = ["console/Cargo.toml"]

[repositories.zuse-skills]
role = "extension"
manifests = []
requires = ["zuse"]

[repositories.zuse-std]
role = "extension"
manifests = []
requires = ["zuse"]

[repositories.zmem]
role = "application"

# Authoritative product versions for non-Cargo repositories.
[scheduled.version_manifests]
oh-my-ztty = "VERSION"
zcall-omarchy = "VERSION"
zcalld-compat = "VERSION"
zshard = "VERSION"
zdistro = "pyproject.toml"
zuse-std = "zuse.json"

[repositories.magicbox]
role = "application"
manifests = ["Cargo.toml", "crates/dns-wire/Cargo.toml"]
