name: Restore tested Project Z candidate
description: Restore an immutable candidate from this run on top of the triggering revision
inputs:
  artifact:
    description: Candidate bundle artifact from this workflow run
    required: true
  sha:
    description: Expected full candidate SHA
    required: true
  recursive:
    description: Initialize the pinned source checkouts
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/project-z-candidate
    - shell: bash
      env:
        CANDIDATE: ${{ inputs.sha }}
        RECURSIVE: ${{ inputs.recursive }}
      run: |
        set -eu
        [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
        git fetch --no-tags "$RUNNER_TEMP/project-z-candidate/cohort.bundle" refs/heads/cohort
        test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
        test "$(git show -s --format=%P "$CANDIDATE")" = "$GITHUB_SHA"
        python scripts/scheduled.py verify "$GITHUB_SHA" "$CANDIDATE"
        if [[ "$RECURSIVE" = true ]]; then
          git checkout --detach "$CANDIDATE"
          git submodule update --init --recursive --jobs 4
        fi
