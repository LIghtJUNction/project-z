name: Release Project Z

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Project Z version increment
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.100.0'

concurrency:
  group: project-z-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      release_consumers: true

  package:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          components: clippy, rustfmt
      - name: Package pinned sources
        id: package
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          tag=$(python3 scripts/release.py "$BUMP" dist)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Packaged $tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: project-z-${{ steps.package.outputs.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: project-z-${{ needs.package.outputs.tag }}
          path: dist
      - name: Publish pinned snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$TAG" "dist/project-z-$TAG.tar.gz" dist/commits.txt \
            --target "$TARGET" --title "Project Z $TAG" --generate-notes
