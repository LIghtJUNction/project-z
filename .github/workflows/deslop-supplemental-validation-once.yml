name: Validate remaining supplemental Rust workspaces

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths: ['.github/workflows/deslop-supplemental-validation-once.yml']

permissions:
  contents: read

concurrency:
  group: supplemental-deslop-validation-once
  cancel-in-progress: false

jobs:
  observe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dot/supplemental-deslop-observation'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [remaining-0, remaining-1, remaining-2, remaining-3, remaining-4, remaining-5]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test supplemental planner
        run: python -m unittest discover -s tests -p test_deslop_supplemental.py -v
      - name: Install pinned scanner
        working-directory: ${{ runner.temp }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-analyzer --component rust-src
          cargo install --locked --version '=0.1.3' --root "$RUNNER_TEMP/deslop-tool" deslop-please
          echo "$RUNNER_TEMP/deslop-tool/bin" >> "$GITHUB_PATH"
          rust-analyzer --version
      - name: Observe a bounded supplemental shard
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 scripts/deslop_observation.py --supplemental="$PROFILE" --output "$RUNNER_TEMP/supplemental-deslop"
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supplemental-deslop-${{ matrix.profile }}
          path: ${{ runner.temp }}/supplemental-deslop
          retention-days: 7
          if-no-files-found: warn
