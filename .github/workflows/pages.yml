name: Build Project Z public site bundle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-z-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Verify public repository and crate sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/scripts/refresh_public.py --verify-only
      - name: Check and build the standalone site
        run: |
          python3 site/scripts/check.py
          python3 site/scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          name: project-z-public-site
          path: site/dist
