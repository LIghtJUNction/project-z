name: Build Project Z documentation bundle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-z-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Install pinned documentation renderer
        run: |
          python3 -m venv site/.cache/venv
          site/.cache/venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r site/requirements.txt
      - name: Check and build the complete documentation site
        run: |
          site/.cache/venv/bin/python site/scripts/check.py
          site/.cache/venv/bin/python site/scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          name: project-z-public-site
          path: site/dist
