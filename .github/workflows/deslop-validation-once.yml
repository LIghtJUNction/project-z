name: Validate Project Z architecture observer once

on:
  push:
    branches: ['dot/project-z-deslop-observation']
    paths: ['.github/workflows/deslop-validation-once.yml']

permissions:
  contents: read

concurrency:
  group: project-z-deslop-candidate-validation
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'LIghtJUNction/project-z' && github.ref == 'refs/heads/dot/project-z-deslop-observation'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the pinned architecture tools
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-analyzer --component rust-src
          cargo install --locked --version '=0.1.3' --root "$RUNNER_TEMP/deslop-tool" deslop-please
          echo "$RUNNER_TEMP/deslop-tool/bin" >> "$GITHUB_PATH"
      - name: Verify isolated fixture behavior
        run: python3 -m unittest discover -s tests -p test_deslop_observation.py -v
      - name: Observe representative recorded repos
        run: python3 scripts/deslop_observation.py --repo z58 --repo z64 --repo zrun --output "$RUNNER_TEMP/deslop-smoke"
      - name: Observe the recorded public workspaces
        run: python3 scripts/deslop_observation.py --output "$RUNNER_TEMP/deslop-report"
      - name: Upload per-workspace results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: project-z-deslop-observation
          path: |
            ${{ runner.temp }}/deslop-report
            ${{ runner.temp }}/deslop-smoke
          if-no-files-found: ignore
          retention-days: 14
