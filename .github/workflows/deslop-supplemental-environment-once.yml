name: Qualify host-native supplemental analyzer coverage

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/deslop-supplemental-environment-once.yml']

permissions:
  contents: read

concurrency:
  group: supplemental-deslop-environment-once
  cancel-in-progress: false

jobs:
  observe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dot/supplemental-deslop-observation'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test supplemental planner
        run: python -m unittest discover -s tests -p test_deslop_supplemental.py -v
      - name: Install pinned scanner
        working-directory: ${{ runner.temp }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-analyzer --component rust-src
          cargo install --locked --version '=0.1.3' --root "$RUNNER_TEMP/deslop-tool" deslop-please
          echo "$RUNNER_TEMP/deslop-tool/bin" >> "$GITHUB_PATH"
          rust-analyzer --version
      - name: Qualify locked native-host and pinned LightFlow workspaces
        env:
          PYTHONPATH: scripts
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import json
          import tempfile
          from pathlib import Path
          from deslop_observation import scan_manifests, scan_repo, safe_path, run
          from deslop_supplemental import plan

          expected = {("LightFlow", "Cargo.toml"), ("magpie-rs-source", "apps/desktop/Cargo.toml")}
          _, coverage = plan(Path.cwd(), "smoke")
          selected = [r for r in coverage if (r["repo"], r["manifest"]) in expected]
          if len(selected) != 2 or any(r["status"] != "environment_review" for r in selected):
              raise ValueError("native qualification target mismatch")
          output = Path(os.environ["RUNNER_TEMP"]) / "supplemental-deslop"
          output.mkdir(exist_ok=False)
          rows = []
          for row in selected:
              repo = row["repo"]
              spec = (repo, f"https://github.com/LIghtJUNction/{repo}.git", row["commit"],
                      (safe_path(row["manifest"]),))
              rows.extend(scan_repo(output, "deslop-please", spec))
          host_pins = {
              "lightflow-rig": "ba52a3cfdd234eeb0206d70d02e63c59aeb478c0",
              "lightflow-std": "4c64b81716860fed40f2aaf7d7eb46dae9183e40",
          }
          git_env = dict(os.environ, GIT_TERMINAL_PROMPT="0", GIT_CONFIG_GLOBAL="/dev/null",
                         GIT_CONFIG_NOSYSTEM="1")
          git = ["git", "-c", "credential.helper=", "-c", "core.askPass="]
          def checkout(path, slug, sha, log):
              path.mkdir(parents=True, exist_ok=True)
              commands = (
                  git + ["init", "--quiet"],
                  git + ["fetch", "--depth=1", "--no-tags", "--",
                         f"https://github.com/LIghtJUNction/{slug}.git", sha],
                  git + ["checkout", "--quiet", "--detach", sha],
              )
              return all(run(cmd, path, log, 45, git_env) == 0 for cmd in commands)
          for row in (r for r in coverage if r["repo"] in host_pins):
              repo = row["repo"]
              if row["manifest"] != "Cargo.toml":
                  raise ValueError("unexpected LightFlow plug-in workspace")
              sha = row["commit"]
              host_sha = host_pins[repo]
              with tempfile.TemporaryDirectory(prefix="host-qualified-lightflow-") as temp:
                  host = Path(temp) / "lightflow"
                  child = host / "projects" / repo
                  with (output / f"{repo}-checkout.log").open("w", encoding="utf-8") as log:
                      ready = checkout(host, "LightFlow", host_sha, log) and checkout(child, repo, sha, log)
                  spec = (repo, None, sha, (safe_path(row["manifest"]),))
                  for result in scan_manifests(child, output, "deslop-please", spec, ready, git, git_env):
                      result["context_host_commit"] = host_sha
                      rows.append(result)
          (output / "qualification.json").write_text(json.dumps(rows, indent=2)+"\n", encoding="utf-8")
          for r in rows:
              status = r["status"]
              if status not in {"clean", "findings", "tool_error"}:
                  raise ValueError("unexpected result")
              print(r["repo"], r["commit"], r["manifest"], status, r.get("context_host_commit", ""))
          raise SystemExit(2 if any(r["status"] == "tool_error" for r in rows) else 0)
          PYTHON
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supplemental-deslop-environment
          path: ${{ runner.temp }}/supplemental-deslop
          retention-days: 7
          if-no-files-found: warn
